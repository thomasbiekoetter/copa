name: Coverage

on:
  push:
    branches: [master]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - uses: actions/checkout@v3

      # Install system dependencies
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gfortran

      # Install LCOV 2.4 (instead of apt version)
      - name: Install LCOV 2.4
        run: |
          sudo apt-get update
          sudo apt-get install -y perl wget make libcapture-tiny-perl libdatetime-perl
          wget https://github.com/linux-test-project/lcov/releases/download/v2.4/lcov-2.4.tar.gz
          tar xzf lcov-2.4.tar.gz
          cd lcov-2.4
          sudo make install

      # Install fpm using the official action
      - name: Setup fpm
        uses: fortran-lang/setup-fpm@v9
        with:
          fpm-version: v0.13.0

      # Run your coverage script
      - name: Run coverage
        run: ./coverage.sh

      # Upload HTML coverage report as artifact
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html

      # Upload coverage info to Codecov for badge
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: coverage.filtered.info
          flags: fortran
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
